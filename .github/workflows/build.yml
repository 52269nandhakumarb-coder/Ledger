name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - run: sed -i 's/sent to|payment of/sent|transferred|payment of/' Ledger/app/src/main/java/com/example/ledger/Store.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: Ledger
      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-apk
          path: Ledger/app/build/outputs/apk/debug/app-debug.apk
