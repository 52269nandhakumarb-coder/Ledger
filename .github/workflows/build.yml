name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - name: Apply updated files
        run: |
          D=Ledger/app/src/main/java/com/example/ledger
          for n in Store MainActivity; do
            f=$(ls "$n"*.kt 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "$f" ]; then cp "$f" "$D/$n.kt"; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: Ledger
      - uses: actions/upload-artifact@v4
        with:
          name: Ledger-apk
          path: Ledger/app/build/outputs/apk/debug/app-debug.apk
